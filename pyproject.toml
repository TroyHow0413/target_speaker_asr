[project]
name = "target-speaker-asr"
version = "0.1.0"
description = "Modular, local target-speaker ASR server with a tablet web client"
readme = "README.md"
requires-python = ">=3.10,<3.13"

# Hardware-independent dependencies. PyTorch itself comes from ONE of the hardware extras below.
dependencies = [
  "numpy",
  "scipy",
  "soundfile",
  "pyyaml",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "requests",
  "cryptography",       # only for scripts/make_cert.py
  "silero-vad",         # default VAD
  "speechbrain",        # default speaker encoder (ECAPA-TDNN)
  "faster-whisper",     # default STT (CTranslate2: CUDA or CPU)
]

[project.optional-dependencies]
# ---- pick exactly ONE hardware extra (they are mutually exclusive) ------------------------------
cpu   = ["torch>=2.7", "torchaudio>=2.7"]   # any machine, no GPU
cu126 = ["torch>=2.7", "torchaudio>=2.7"]   # NVIDIA, CUDA 12.6 wheels (older cards / older drivers)
cu128 = ["torch>=2.7", "torchaudio>=2.7"]   # NVIDIA, CUDA 12.8 wheels (needed for RTX 50-series)
rocm  = ["torch>=2.7", "torchaudio>=2.7", "pytorch-triton-rocm; sys_platform == 'linux'"]   # AMD GPUs, ROCm wheels (Linux only)
xpu   = ["torch>=2.7", "torchaudio>=2.7", "pytorch-triton-xpu; sys_platform == 'linux'", "triton-xpu; sys_platform == 'linux'"]   # Intel GPUs (Arc / Iris Xe), Windows + Linux
apple = ["torch>=2.7", "torchaudio>=2.7"]   # Apple Silicon: the normal PyPI macOS wheel includes MPS

# ---- optional backends (combine with any hardware extra) ---------------------------------------
funasr = ["funasr", "modelscope"]                                   # stt: funasr (SenseVoice / Paraformer)
hf     = ["transformers", "accelerate"]                            # stt: hf_transformers (MMS, Whisper fine-tunes ...)
sherpa = ["sherpa-onnx"]                                            # stt/speaker: sherpa_onnx
onnx   = ["onnxruntime"]                                            # vad: silero_onnx preset
mlx    = ["mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'"]  # stt: mlx_whisper
# deepfilternet is not an extra (its wheels are picky): `uv pip install deepfilternet`, then `uv run --no-sync ...`

[tool.uv]
package = false          # an application, not a library: nothing to build/install
conflicts = [[
  { extra = "cpu" }, { extra = "cu126" }, { extra = "cu128" },
  { extra = "rocm" }, { extra = "xpu" }, { extra = "apple" },
]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu",   extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu",   extra = "xpu",  marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
  { index = "pytorch-cpu",   extra = "cpu" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
  { index = "pytorch-rocm",  extra = "rocm", marker = "sys_platform == 'linux'" },
  { index = "pytorch-xpu",   extra = "xpu",  marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

# triton builds that torch depends on only exist on the PyTorch indexes, not PyPI.
pytorch-triton-xpu = [{ index = "pytorch-xpu",  extra = "xpu",  marker = "sys_platform == 'linux'" }]
triton-xpu         = [{ index = "pytorch-xpu",  extra = "xpu",  marker = "sys_platform == 'linux'" }]
pytorch-triton-rocm = [{ index = "pytorch-rocm", extra = "rocm", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.3"   # check pytorch.org for the newest ROCm tag
explicit = true

[[tool.uv.index]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
explicit = true
